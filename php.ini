;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Basic PHP configuration for production
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; -----------------------
; Resource Limits
; -----------------------

memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; -----------------------
; Error Handling
; -----------------------

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------
; Date & Time
; -----------------------

date.timezone = Europe/Rome

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; OPCache Configuration
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

opcache.enable = 1
opcache.enable_cli = 0

; How much memory in MB to allocate to OPcache
opcache.memory_consumption = 256

; How much memory for interned strings
opcache.interned_strings_buffer = 16

; Maximum number of PHP files OPCache should store
opcache.max_accelerated_files = 20000

; How often (in seconds) to check for script updates
; A larger value reduces file checks and speeds response,
; but requires manual reset or restart after deployments.
opcache.revalidate_freq = 60

opcache.validate_timestamps = 1

; Enables faster shutdown routines
opcache.fast_shutdown = 1

; Ensure comments in cached code are preserved
opcache.save_comments = 1

; Recommended in many production setups
opcache.enable_file_override = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Other PHP Performance
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; You can tune session and other values below if needed
; session.gc_maxlifetime = 1440
